name: Upload source code to kaggle

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches:
      - main   # Trigger only on main branch p

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  upload:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Build package wheel
      - name: build wheel
        run: |
          pip install uv==0.9.1
          uv build --wheel && rm -rf build

      # Runs a single command using the runners shell
      - name: Upload datasets
        uses: jaimevalero/push-kaggle-dataset@v3.2 # This is the action
        env:
          # Do not leak your credentials.
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

        with:
          id:  "meodes/arc-2025-source-code"
          title: "github actions for upload datasets"
          subtitle: ""
          description: ""
          files: |
            src
            envs
            scripts
            pyproject.toml
            README.md
            dist
          is_public: false