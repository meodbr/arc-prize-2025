name: Build & Push to Google Artifact Registry

on:
  push:
    branches:
      - main   # Trigger only on main branch pushes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Artifact Registry Build & Push
        uses: piotr-krusinski/action-google-artifact-registry@v1.0
        with:
          google_project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          google_artifact_registry_region: ${{ secrets.GOOGLE_CLOUD_REGION }}   # e.g., us-central1
          google_artifact_registry_hostname: ${{ secrets.GOOGLE_CLOUD_REGION }}-docker.pkg.dev
          google_artifact_registry_name: arc-tartiflette
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          dockerfile: ./Dockerfile
          image_name: arc-app
          tag_list: latest ${{ github.sha }}