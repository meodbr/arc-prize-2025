[project]
name = "arc_tartiflette"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Méo Desbois-Renaudin", email = "meo.desbois@gmail.com" }
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "transformers",
    "trl",
    "torch>=2.4,<2.7"
]

[project.scripts]
arc-tartiflette = "arc_tartiflette:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_tartiflette"]